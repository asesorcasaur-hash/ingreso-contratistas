<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Verificación de ingreso de contratistas · Universidad del Rosario</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪪</text></svg>">
<style>
  /* =============================================================
     CONFIGURACIÓN: solo cambia dos líneas al final del archivo
     (SUPABASE_URL y SUPABASE_KEY, en la sección CONFIGURACIÓN)
     ============================================================= */
  :root {
    --vino: #7a0f2b;
    --vino-hondo: #5c0b20;
    --fondo: #f6f3f1;
    --papel: #ffffff;
    --tinta: #231c1e;
    --tinta-suave: #6b5f62;
    --linea: #e4dcdc;
    --ok: #1d6b45;      --ok-fondo: #e7f4ec;
    --mal: #a4261d;     --mal-fondo: #fbeae8;
    --aviso: #875400;   --aviso-fondo: #fdf3dd;
    --radio: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --vino: #d86a86;
      --vino-hondo: #e88aa2;
      --fondo: #171213;
      --papel: #221b1d;
      --tinta: #f3ecee;
      --tinta-suave: #b3a6aa;
      --linea: #3a2f32;
      --ok: #7fd4a4;     --ok-fondo: #173226;
      --mal: #f19a92;    --mal-fondo: #3a1c1a;
      --aviso: #f0c46b;  --aviso-fondo: #362a12;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    min-height: 100vh;
  }

  .barra {
    background: var(--vino);
    color: #fff;
    padding: 12px 20px;
    font-size: 15px;
  }
  @media (prefers-color-scheme: dark) { .barra { background: #4a0a1b; } }
  .barra b { font-weight: 650; }

  main {
    max-width: 560px;
    margin: 28px auto 40px;
    padding: 0 16px;
  }
  .tarjeta {
    background: var(--papel);
    border: 1px solid var(--linea);
    border-radius: 20px;
    padding: 28px 24px 24px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--vino-hondo);
  }
  .sub { margin: 0 0 22px; color: var(--tinta-suave); }

  .formulario { display: flex; gap: 10px; }
  .campo { position: relative; flex: 1; }
  input {
    width: 100%;
    font: inherit;
    font-size: 26px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    padding: 14px 44px 14px 16px;
    border: 2px solid var(--linea);
    border-radius: var(--radio);
    background: var(--papel);
    color: var(--tinta);
    outline: none;
  }
  input::placeholder { color: var(--tinta-suave); opacity: .55; letter-spacing: 0; font-size: 20px; }
  input:focus { border-color: var(--vino); }
  .limpiar {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: transparent; color: var(--tinta-suave);
    font-size: 24px; line-height: 1; cursor: pointer;
  }
  .limpiar:hover { background: var(--fondo); }
  button.consultar {
    font: inherit; font-weight: 650;
    padding: 0 22px;
    border: 0; border-radius: var(--radio);
    background: var(--vino); color: #fff;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button.consultar { background: #9c1c3c; } }
  button.consultar:disabled { opacity: .6; cursor: progress; }
  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid var(--vino); outline-offset: 2px;
  }
  .pista { margin: 8px 2px 0; font-size: 14px; color: var(--tinta-suave); }

  #resultado { margin-top: 24px; }
  #resultado:empty { display: none; }

  .persona { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--linea); }
  .persona .nombre { font-size: 23px; font-weight: 700; line-height: 1.2; }
  .persona .meta { color: var(--tinta-suave); font-size: 15px; margin-top: 4px; }

  .estado {
    display: flex; gap: 14px; align-items: center;
    padding: 14px 16px; border-radius: var(--radio);
    margin-bottom: 10px;
  }
  .estado .icono {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
  }
  .estado .etiqueta { font-size: 14px; color: var(--tinta-suave); display: block; }
  .estado .valor { font-size: 21px; font-weight: 800; display: block; line-height: 1.2; }
  .estado .detalle { font-size: 14px; display: block; margin-top: 2px; }
  .ok    { background: var(--ok-fondo); }    .ok .icono    { background: var(--ok); }    .ok .valor    { color: var(--ok); }
  .mal   { background: var(--mal-fondo); }   .mal .icono   { background: var(--mal); }   .mal .valor   { color: var(--mal); }
  .aviso { background: var(--aviso-fondo); } .aviso .icono { background: var(--aviso); } .aviso .valor { color: var(--aviso); }
  @media (prefers-color-scheme: dark) { .estado .icono { color: #171213; } }

  .panel { padding: 16px; border-radius: var(--radio); }
  .alerta {
    background: var(--mal); color: #fff; border-radius: 18px;
    padding: 22px 20px; margin-bottom: 16px; text-align: center;
  }
  @media (prefers-color-scheme: dark) { .alerta { background: #b3261e; } }
  .alerta svg { display: block; margin: 0 auto 6px; }
  .alerta .titulo { font-size: 40px; font-weight: 900; letter-spacing: .02em; line-height: 1.05; }
  .alerta .texto { font-size: 21px; font-weight: 600; margin-top: 8px; }
  .alerta .accion { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 99px; background: rgba(255,255,255,.18); font-size: 16px; font-weight: 700; }
  .panel a { color: inherit; font-weight: 650; }
  .enlace {
    display: inline-block; margin-top: 10px;
    background: none; border: 0; padding: 4px 0;
    font: inherit; font-size: 15px; font-weight: 600;
    color: var(--vino); text-decoration: underline; cursor: pointer;
  }

  .cargando { height: 132px; border-radius: var(--radio); background: var(--fondo); animation: pulso 1.1s ease-in-out infinite; }
  @keyframes pulso { 50% { opacity: .45; } }
  .aparece { animation: aparece .22s ease-out; }
  @keyframes aparece { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .cargando, .aparece { animation: none; } }

  .pie { text-align: center; font-size: 13px; color: var(--tinta-suave); margin-top: 18px; }

  @media (max-width: 480px) {
    .formulario { flex-direction: column; }
    button.consultar { padding: 14px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
  <div class="barra"><b>Universidad del Rosario</b> · Gestión Humana</div>

  <main>
    <section class="tarjeta">
      <h1>Verificación de ingreso</h1>
      <p class="sub">Digite el número de documento del contratista, sin puntos ni comas.</p>

      <div class="formulario">
        <div class="campo">
          <label for="doc" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Número de documento</label>
          <input id="doc" type="text" inputmode="numeric" autocomplete="off" placeholder="Ej: 80185871" maxlength="20" autofocus>
          <button type="button" class="limpiar" id="limpiar" aria-label="Limpiar" hidden>×</button>
        </div>
        <button type="button" class="consultar" id="consultar">Consultar</button>
      </div>
      <p class="pista">Presione Enter o el botón «Consultar».</p>

      <div id="resultado" aria-live="polite" role="status"></div>
    </section>
    <p class="pie">El resultado se borra solo después de un minuto.</p>
  </main>

<script>
  // ==================== CONFIGURACIÓN ====================
  const SUPABASE_URL = 'https://oichmbiwurtzcxmydoiq.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_RFmCbBs8UOMMPi5SPmyi6A_r2RRsaAI'   // Settings > API Keys > anon / publishable
  const PORTAL_URL   = 'https://portalservicios.urosario.edu.co/urosario/login'
  const BORRAR_EN_MS = 60000
  // =======================================================

  const $doc = document.getElementById('doc')
  const $btn = document.getElementById('consultar')
  const $limpiar = document.getElementById('limpiar')
  const $res = document.getElementById('resultado')
  let temporizador = null
  let peticion = null

  const ICONOS = {
    ok:    '<svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    mal:   '<svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    aviso: '<svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 4.6V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
  const fecha = iso => { if (!iso) return null; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}` }
  const limpiarDoc = v => v.replace(/[^0-9A-Za-z]/g, '')

  function bloque(clase, etiqueta, valor, detalle) {
    return `<div class="estado ${clase}">
      <span class="icono">${ICONOS[clase]}</span>
      <span><span class="etiqueta">${etiqueta}</span><span class="valor">${valor}</span><span class="detalle">${esc(detalle)}</span></span>
    </div>`
  }

  const ALERTA_SVG = '<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 5l14 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'

  function alertaSinAcceso(ss) {
    if (ss.estado === 'AUTORIZADO') return ''
    const textos = {
      FINALIZADO: `Su acceso finalizó el ${fecha(ss.vigencia)}`,
      NO_INICIA: `Su acceso inicia el ${fecha(ss.desde)}`,
      NO_AUTORIZADO_GESTOR: 'No fue autorizado por el gestor',
      SIN_REGISTRO: 'No tiene autorización de ingreso registrada'
    }
    return `<div class="alerta" role="alert">${ALERTA_SVG}
      <div class="titulo">SIN ACCESO</div>
      <div class="texto">${esc(textos[ss.razon] || 'No tiene autorización vigente')}</div>
      <div class="accion">No permita el ingreso</div></div>`
  }

  function bloqueSS(ss) {
    if (ss.estado !== 'AUTORIZADO') return ''
    const d = fecha(ss.desde), f = fecha(ss.vigencia)
    return bloque('ok', 'Autorización de ingreso', 'AUTORIZADO', d ? `Del ${d} al ${f}` : (f ? `Vigente hasta el ${f}` : 'Vigente'))
  }

  function bloqueInd(ind) {
    const f = fecha(ind.fechaVencimiento)
    if (ind.estado === 'VIGENTE') return bloque('ok', 'Inducción SST', 'VIGENTE', f ? `Vigente hasta el ${f}` : 'Vigente')
    if (ind.estado === 'VENCIDA') return bloque('mal', 'Inducción SST', 'VENCIDA', f ? `Desde el ${f}` : 'Vencida')
    return bloque('aviso', 'Inducción SST', 'PENDIENTE', 'Pendiente por realizar')
  }

  const otro = '<button type="button" class="enlace" data-accion="limpiar">Consultar otro documento</button>'

  function mostrar(html) {
    $res.innerHTML = html ? `<div class="aparece">${html}</div>` : ''
    clearTimeout(temporizador)
    if (html) temporizador = setTimeout(limpiar, BORRAR_EN_MS)
  }

  async function consultar() {
    const doc = limpiarDoc($doc.value)
    if (!doc) { mostrar(''); $doc.focus(); return }

    peticion?.abort()
    peticion = new AbortController()
    $btn.disabled = true
    $btn.textContent = 'Consultando…'
    $res.innerHTML = '<div class="cargando" aria-label="Consultando"></div>'

    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/consultar_contratista`, {
        method: 'POST',
        signal: peticion.signal,
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
        body: JSON.stringify({ p_documento: doc })
      })
      const data = await r.json().catch(() => ({}))
      if (!r.ok) {
        const msg = /Demasiadas/.test(data.message || '') ? data.message : 'No se pudo consultar. Verifique la conexión e intente de nuevo.'
        mostrar(`<div class="panel aviso">${esc(msg)}<div><button type="button" class="enlace" data-accion="consultar">Reintentar</button></div></div>`)
        return
      }
      if (!data.encontrado) {
        mostrar(`<div class="panel aviso">
          No se encontró información para el documento <strong>${esc(doc)}</strong>.<br>
          Solicite la autorización a través del <a href="${PORTAL_URL}" target="_blank" rel="noopener noreferrer">Portal Único de Servicios</a>.
          <div>${otro}</div></div>`)
        return
      }
      const t = data.trabajador
      mostrar(`
        ${alertaSinAcceso(data.seguridadSocial)}
        <div class="persona">
          <div class="nombre">${esc(t.nombre || '—')}</div>
          <div class="meta">Documento ${esc(t.documento)}${t.empresa ? ' · ' + esc(t.empresa) : ''}</div>
        </div>
        ${bloqueSS(data.seguridadSocial)}
        ${bloqueInd(data.induccion)}
        ${otro}`)
    } catch (e) {
      if (e.name === 'AbortError') return
      mostrar(`<div class="panel aviso">No se pudo conectar con el sistema. Verifique la red e intente de nuevo.<div><button type="button" class="enlace" data-accion="consultar">Reintentar</button></div></div>`)
    } finally {
      $btn.disabled = false
      $btn.textContent = 'Consultar'
    }
  }

  function limpiar() {
    peticion?.abort()
    clearTimeout(temporizador)
    $doc.value = ''
    $limpiar.hidden = true
    $res.innerHTML = ''
    $doc.focus()
  }

  $btn.addEventListener('click', consultar)
  $limpiar.addEventListener('click', limpiar)
  $doc.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); consultar() } })
  $doc.addEventListener('input', () => {
    $limpiar.hidden = !$doc.value
    if ($res.innerHTML && !$res.querySelector('.cargando')) mostrar('')
  })
  $res.addEventListener('click', e => {
    const a = e.target.closest('[data-accion]')
    if (!a) return
    a.dataset.accion === 'limpiar' ? limpiar() : consultar()
  })
</script>
</body>
</html>
